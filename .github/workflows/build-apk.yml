name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Create .env
        run: cp .env.example .env

      - name: Patch build files to standard AGP 8.x
        run: |
          python3 - <<'EOF'
          import re, pathlib

          # ── gradle/libs.versions.toml ──────────────────────────────────────
          toml = pathlib.Path("gradle/libs.versions.toml")
          t = toml.read_text()
          t = re.sub(r'agp\s*=\s*"[^"]*"',              'agp = "8.7.3"',           t)
          t = re.sub(r'kotlin\s*=\s*"[^"]*"',            'kotlin = "2.1.21"',       t)
          t = re.sub(r'googleDevtoolsKsp\s*=\s*"[^"]*"', 'googleDevtoolsKsp = "2.1.21-1.0.32"', t)
          toml.write_text(t)

          # ── app/build.gradle.kts ───────────────────────────────────────────
          kts = pathlib.Path("app/build.gradle.kts")
          k = kts.read_text()

          # Brace-depth-aware block replace/strip. A naive [^}]* regex breaks on
          # any nested '{'/'}' pair — e.g. compileSdk's nested release(36){...}
          # block, or "${rootDir}" string interpolation inside signingConfigs —
          # because the FIRST '}' encountered (however deeply nested) satisfies
          # the regex's own closing brace and truncates the match early,
          # corrupting everything after it (see build failure 2026-06-13).
          def replace_block(text: str, marker: str, replacement: str) -> str:
              start = text.find(marker)
              if start == -1:
                  return text
              brace_open = text.index("{", start)
              depth = 0
              i = brace_open
              while i < len(text):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement + text[i + 1:]
                  i += 1
              raise ValueError(f"Unbalanced braces while replacing {marker!r}")

          # Replace AI Studio custom compileSdk DSL with integer form
          k = replace_block(k, "compileSdk {", "compileSdk = 35")
          # Bring targetSdk in line
          k = re.sub(r'targetSdk\s*=\s*36', 'targetSdk = 35', k)

          # Drop the release signing config block (keystore not available in CI)
          k = replace_block(k, 'create("release")', "")
          # Remove the reference to the now-deleted release signing config
          k = re.sub(r'\s*signingConfig = signingConfigs\.getByName\("release"\)', '', k)

          kts.write_text(k)
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pl-advisor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
